version: 0.2

phases:
  pre_build:
    commands:
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPOSITORY_NAME="contentx-postiz-webhook"
      - IMAGE_TAG="02e502f"
      - IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$REPOSITORY_NAME:$IMAGE_TAG
  build:
    commands:
      - echo "Building the Docker image on `date`"
      - docker build -f Dockerfile.dev -t $IMAGE_URI --build-arg NEXT_PUBLIC_VERSION=$IMAGE_TAG .
  post_build:
    commands:
      - echo "Pushing the Docker image to ECR on `date`"
      - docker push $IMAGE_URI
      - echo "Build completed successfully"

artifacts:
  files: []
